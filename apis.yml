name: Flipside Crypto
kind: company
description: Flipside Crypto is a blockchain analytics platform that lets analysts and
  developers run SQL queries against curated, Snowflake-backed on-chain datasets covering
  Ethereum, Solana, and 20+ other chains. The Data API exposes query execution and
  result retrieval over a JSON-RPC-style HTTP interface at api-v2.flipsidecrypto.xyz,
  authenticated with an x-api-key. In May 2026 Flipside sold its blockchain data business
  to SonarX and refocused on its edisyl enterprise AI platform; this catalog documents
  the Flipside Data API as published.
