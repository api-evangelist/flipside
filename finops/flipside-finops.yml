specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Flipside Crypto
providerId: flipside
created: '2026-06-21'
modified: '2026-06-21'
reconciled: false
tags:
- Blockchain
- Analytics
- SQL
- Web3
- Data
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Flipside Data API spend. Flipside meters consumption in query
  seconds (warehouse-seconds) consumed by SQL execution against curated
  Snowflake-backed datasets. Each account receives a free monthly allotment;
  additional query seconds are purchased via Builder, Pro, and Enterprise
  tiers. Cost is driven by query complexity and scanned data, so caching
  (maxAgeMinutes, resultTTLHours) and cancellation materially affect spend.
notes: >-
  As of May 2026 Flipside sold its blockchain data business to SonarX; per-tier
  dollar rates are quoted via sales and are not publicly fixed. Verify metering
  and rates against the active provider during reconciliation.
sources:
- https://docs.flipsidecrypto.xyz
- https://flipsidecrypto.xyz/pricing
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Flipside Crypto
serviceCategory: Analytics
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
meters:
- name: query_seconds
  description: Warehouse/query seconds consumed executing SQL via createQuery, billed above the free allotment.
  unit: seconds
  aggregation: sum
  dimensions:
  - account
  - api_key
  - dataSource
- name: queries_executed
  description: Count of query runs created via createQuery.
  unit: queries
  aggregation: sum
  dimensions:
  - account
  - api_key
- name: result_rows_returned
  description: Rows returned through getQueryRunResults pagination.
  unit: rows
  aggregation: sum
  dimensions:
  - account
  - queryRunId
principles:
- name: Visibility
  description: Track query-seconds burn per API key and per workload against the free allotment and paid budget.
- name: Allocation
  description: Use createQuery tags and per-key separation to map query-seconds spend to teams and workloads.
- name: Optimization
  description: Reuse cached results via maxAgeMinutes/resultTTLHours, narrow SQL scans, paginate efficiently, and cancelQueryRun on runaway queries.
- name: Accountability
  description: Assign owners per API key/project and review monthly query-seconds consumption against budget.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
